name: PR Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install synthetic CFBD fixture
        run: npm run fixture:cache

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: /Gridiron-Curve
          PUBLIC_SITE_HOST: devhl-labs.github.io/Gridiron-Curve
        run: npm run build

      - name: Verify static export
        run: |
          test -f out/index.html
          test -f out/generated/v1/manifest.json
          test -f out/generated/v1/images/2099/week-02/v0.11.jpg
          node - <<'NODE'
          const manifest = require("./out/generated/v1/manifest.json");
          const seasons = manifest.seasons.map(({ season }) => season);
          if (seasons.join(",") !== "2098,2099") {
            throw new Error(`Unexpected fixture seasons: ${seasons.join(",")}`);
          }
          if (manifest.modelVersions.length !== 5) {
            throw new Error("The fixture build did not publish all five models.");
          }
          NODE
