name: PR Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install synthetic CFBD fixture
        run: npm run fixture:cache

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: /Gridiron-Curve
          PUBLIC_SITE_HOST: devhl-labs.github.io/Gridiron-Curve
        run: npm run build

      - name: Verify static export
        run: |
          test -f out/index.html
          test -f out/generated/v5/manifest.json
          test -f out/generated/v5/images/2099/week-02/ResultNetwork.1.0.jpg
          test -f out/generated/v5/images/2099/week-02/RecordValue.2.0.jpg
          test -f out/generated/v5/images/2099/week-02/CappedMarginPerformance.1.0.jpg
          test -f out/generated/v5/images/2099/week-02/Consensus.6.0.jpg
          test -f out/generated/v5/images/2099/week-02/Blend.6.0.jpg
          node - <<'NODE'
          const manifest = require("./out/generated/v5/manifest.json");
          const seasons = manifest.seasons.map(({ season }) => season);
          if (seasons.join(",") !== "2098,2099") {
            throw new Error(`Unexpected fixture seasons: ${seasons.join(",")}`);
          }
          const expectedSystems = [
            "ResultNetwork.1.0",
            "RecordValue.2.0",
            "CappedMarginPerformance.1.0",
            "Consensus.6.0",
            "Blend.6.0",
          ];
          if (manifest.rankingSystemIds.join(",") !== expectedSystems.join(",")) {
            throw new Error(`Unexpected publication closure: ${manifest.rankingSystemIds.join(",")}`);
          }
          const consensus = require("./out/generated/v5/rankings/2099/week-02/Consensus.6.0.json");
          const expectedWeights = new Map([
            ["ResultNetwork.1.0", 0],
            ["RecordValue.2.0", 0.4],
            ["CappedMarginPerformance.1.0", 0.6],
          ]);
          if (
            consensus.rankings.length === 0 ||
            consensus.rankings.some(
              ({ consensusRanks, resumePressure, lossPressure, resumeMaturity }) =>
                consensusRanks?.length !== 3 ||
                consensusRanks.some(
                  ({ rankingSystemId, included, weight }) =>
                    !included ||
                    weight !== expectedWeights.get(rankingSystemId),
                ) ||
                resumePressure === undefined ||
                lossPressure === undefined ||
                resumeMaturity === undefined,
            )
          ) {
            throw new Error("The fixture Consensus.6 does not expose weights, résumé evidence, and loss pressure.");
          }
          const blend = require("./out/generated/v5/rankings/2099/week-02/Blend.6.0.json");
          const consensusRanks = new Map(
            consensus.rankings.map(({ team, rank }) => [team, rank]),
          );
          if (
            blend.rankings.length === 0 ||
            blend.rankings.some(
              ({ team, blendComponents }) =>
                blendComponents?.length !== 3 ||
                blendComponents.find(
                  ({ source }) => source === "Gridiron Consensus",
                )?.rank !== consensusRanks.get(team),
            )
          ) {
            throw new Error("The fixture Blend.6 does not use Consensus.6.");
          }
          NODE
